name: Publish OpenArtifacts npm package

on:
  push:
    branches:
      - main
    paths:
      - packages/openartifacts/package.json

concurrency:
  group: publish-openartifacts-npm
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    if: github.repository == 'Brevilabs/OpenArtifacts'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.registry.outputs.exists }}
      version: ${{ steps.package.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Read and validate package version
        id: package
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/openartifacts/package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').packages['packages/openartifacts'].version")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version must be a stable X.Y.Z version, found $version"
            exit 1
          fi
          if [[ "$version" != "$lock_version" ]]; then
            echo "::error::package.json is $version but package-lock.json is $lock_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published
        id: registry
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --retry 3 \
            --output /tmp/npm-version.json --write-out '%{http_code}' \
            "https://registry.npmjs.org/openartifacts/$VERSION")"
          case "$code" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "openartifacts $VERSION is already published; nothing to do"
              ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::npm registry returned HTTP $code"; exit 1 ;;
          esac

  publish:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-latest
    environment: package-release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use an npm version with Trusted Publishing support
        run: npm install --global npm@11.5.1

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Inspect package contents
        run: npm pack --workspace packages/openartifacts --dry-run

      - name: Publish
        run: npm publish --workspace packages/openartifacts --access public --provenance

      - name: Verify published version
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          curl --fail --silent --show-error --location --retry 10 \
            --retry-all-errors --retry-delay 3 \
            "https://registry.npmjs.org/openartifacts/$VERSION" \
            --output /dev/null
          echo "openartifacts $VERSION is available from npm"
