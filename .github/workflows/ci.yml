name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
          cache: npm

      - name: Check npm release title and versions
        if: github.event_name == 'pull_request'
        run: node scripts/check-release-pr.cjs

      - name: Install dependencies
        run: npm ci

      - name: Check hosted account routing
        run: node scripts/check-account-actions.cjs

      - name: Typecheck
        run: npm run typecheck

      - name: Check release permission boundary
        run: node --test test/release-workflow.node.cjs

      - name: Test
        run: npm test
