name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
          cache: npm

      - name: Check npm release title and versions
        if: github.event_name == 'pull_request'
        run: node scripts/check-release-pr.cjs

      - name: Check Copilot access coverage
        if: github.event_name == 'pull_request' && github.repository == 'Brevilabs/OpenArtifacts'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          if git diff --quiet "$BASE_SHA" HEAD -- packages/openartifacts/src/access.cjs; then
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            https://raw.githubusercontent.com/logancyang/obsidian-copilot/master/apps/obsidian/src/openArtifacts/accessCoverage.json \
            | node scripts/check-copilot-access.mjs

      # No audit: npm's audit endpoint is being retired and can hold `npm ci`
      # for five minutes before giving up. Its report never fails the job anyway.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check hosted account routing
        run: node scripts/check-account-actions.cjs

      - name: Typecheck
        run: npm run typecheck

      - name: Check release permission boundary
        run: node --test test/release-workflow.node.cjs

      - name: Test
        run: npm test

      - name: Browser test
        run: npm run test:browser
